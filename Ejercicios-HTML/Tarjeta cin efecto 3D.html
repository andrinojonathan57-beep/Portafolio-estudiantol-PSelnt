<!doctype html>
<html>
    <head>
        <style>
            .tarjeta {
                 width: 250px;
    padding: 20px;
    border: 1px solid gray;
    border-radius: 10px;
    background-color: white;
    transition: 0.5s;
            }
            .tarjeta:hover {
    transform: scale(1);
    box-shadow: 0 10px 20px purple;
}
            </style>
        
    </head>
    <body>
    <div class="tarjeta">
    <h2>Mi tarjeta</h2>
    <p>Esta es mi primera tarjeta con efecto 3D.</p>
    </div>
</body>
</html>
