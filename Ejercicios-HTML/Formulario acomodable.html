<!doctype html>
<html>
    <head>
        <style>
            .formulario {
                display: grid;
                grid-template-columns: 1fr 1fr;
gap: 15px;
            }
            @media(max-width: 600px)    {
                .formulario {
                    grid-template-columns: 1fr;
                }
            }
            </style>
    </head>
<body>
    <form class="formulario">
        <div>
            <label> Nombre:</label>
            <input type="text">
        </div>
        <div>
            <label> Apellido:</label>
            <input type="text">
        </div>
        <div>
            <label> Email:</label>
            <input type="email">
        </div>
        <div>
            <label>Telefono:</label>
            <input type="tel">
        </div>
        <div>
            <label>Dirreccion:</label>
            <input type="text">
        </div>
        <div>
            <label> Ciudad :</label>
            <input type="text">
        </div>
        <button> Enviar</button>

    </form>
    </body>
</html>
